<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f6f7f2">
	<title>오늘의 할 일11</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #202b27;
			--muted: #78827c;
			--line: #e6e9e2;
			--paper: #fff;
			--canvas: #f6f7f2;
			--green: #277b5d;
			--green-dark: #1d6149;
			--mint: #e7f2eb;
			--coral: #d7785e;
			--shadow: 0 22px 65px rgb(34 49 40 / 8%);
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			background:
				radial-gradient(ellipse at 9% 9%, rgb(227 237 222 / 65%), transparent 28rem),
				radial-gradient(ellipse at 94% 82%, rgb(244 226 211 / 54%), transparent 26rem),
				var(--canvas);
			font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
			letter-spacing: 0;
		}

		button, input { font: inherit; }
		button { color: inherit; }

		.page {
			width: min(100% - 40px, 760px);
			margin: 0 auto;
			padding: 48px 0 64px;
		}

		.topline {
			display: flex;
			align-items: center;
			justify-content: flex-end;
			margin-bottom: 30px;
			color: var(--muted);
			font-size: 13px;
		}

		.hero {
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
			gap: 20px;
			margin-bottom: 26px;
		}

		.eyebrow {
			margin: 0 0 9px;
			color: var(--green);
			font-size: 12px;
			font-weight: 800;
		}

		h1 {
			margin: 0;
			font-family: "Batang", "Nanum Myeongjo", serif;
			font-size: 46px;
			font-weight: 700;
			line-height: 1.2;
		}

		.hero-note {
			margin: 0 0 4px;
			color: var(--muted);
			font-size: 13px;
			line-height: 1.6;
			text-align: right;
		}

		.workspace {
			overflow: hidden;
			border: 1px solid rgb(222 227 217 / 85%);
			border-radius: 12px;
			background: var(--paper);
			box-shadow: var(--shadow);
			animation: arrive 420ms ease-out both;
		}

		.summary {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 20px;
			padding: 23px 26px 20px;
			background: linear-gradient(110deg, #f1f6ef, #faf8f1 78%);
		}

		.summary-copy { min-width: 0; }

		.summary-title {
			margin: 0 0 5px;
			font-size: 14px;
			font-weight: 800;
		}

		.summary-caption {
			margin: 0;
			color: var(--muted);
			font-size: 12px;
		}

		.progress-count {
			flex: 0 0 auto;
			color: var(--green-dark);
			font-size: 13px;
			font-weight: 800;
		}

		.progress-track {
			height: 4px;
			background: #e3e9df;
		}

		.progress-fill {
			width: 0;
			height: 100%;
			background: var(--green);
			transition: width 240ms ease;
		}

		.composer {
			display: flex;
			gap: 10px;
			padding: 22px 26px;
			border-bottom: 1px solid var(--line);
		}

		.task-input {
			width: 100%;
			min-width: 0;
			height: 46px;
			padding: 0 14px;
			border: 1px solid #dfe4dc;
			border-radius: 7px;
			outline: none;
			background: #fff;
			color: var(--ink);
			font-size: 14px;
			transition: border-color 150ms ease, box-shadow 150ms ease;
		}

		.task-input::placeholder { color: #a0a9a2; }
		.task-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgb(39 123 93 / 12%); }

		.add-button {
			display: inline-flex;
			flex: 0 0 auto;
			align-items: center;
			justify-content: center;
			gap: 7px;
			min-width: 94px;
			height: 46px;
			padding: 0 15px;
			border: 0;
			border-radius: 7px;
			background: var(--green);
			color: white;
			font-size: 13px;
			font-weight: 800;
			cursor: pointer;
			transition: background 150ms ease, transform 150ms ease;
		}

		.add-button:hover { background: var(--green-dark); }
		.add-button:active { transform: translateY(1px); }
		.add-button svg { width: 16px; height: 16px; }

		.list-toolbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 15px 26px 9px;
		}

		.filters { display: flex; gap: 5px; }

		.filter-button {
			min-height: 32px;
			padding: 0 11px;
			border: 0;
			border-radius: 6px;
			background: transparent;
			color: var(--muted);
			font-size: 12px;
			font-weight: 700;
			cursor: pointer;
		}

		.filter-button:hover { background: #f4f6f2; }
		.filter-button[aria-pressed="true"] { background: var(--mint); color: var(--green-dark); }

		.clear-button {
			padding: 7px 0 7px 8px;
			border: 0;
			background: transparent;
			color: var(--muted);
			font-size: 12px;
			cursor: pointer;
		}

		.clear-button:hover { color: var(--coral); }
		.clear-button:disabled { visibility: hidden; }

		.task-list {
			min-height: 112px;
			padding: 0 26px 12px;
		}

		.task-row {
			display: flex;
			align-items: center;
			gap: 12px;
			min-height: 57px;
			border-bottom: 1px solid #eff1ed;
			animation: arrive 220ms ease-out both;
		}

		.task-check {
			display: grid;
			flex: 0 0 20px;
			width: 20px;
			height: 20px;
			place-items: center;
			padding: 0;
			border: 1.5px solid #c9d1c9;
			border-radius: 50%;
			background: white;
			color: transparent;
			cursor: pointer;
			transition: background 150ms ease, border-color 150ms ease;
		}

		.task-check:hover { border-color: var(--green); }
		.task-check svg { width: 12px; height: 12px; }
		.task-row.is-done .task-check { border-color: var(--green); background: var(--green); color: white; }

		.task-text {
			flex: 1;
			min-width: 0;
			overflow-wrap: anywhere;
			color: #38443d;
			font-size: 14px;
			line-height: 1.5;
		}

		.task-row.is-done .task-text { color: #a2aaa3; text-decoration: line-through; }

		.delete-button {
			display: grid;
			flex: 0 0 32px;
			width: 32px;
			height: 32px;
			place-items: center;
			padding: 0;
			border: 0;
			border-radius: 6px;
			background: transparent;
			color: #9aa39c;
			cursor: pointer;
		}

		.delete-button:hover { background: #fcf0ec; color: var(--coral); }
		.delete-button svg { width: 16px; height: 16px; }

		.empty-state {
			display: grid;
			min-height: 190px;
			place-content: center;
			justify-items: center;
			gap: 8px;
			color: var(--muted);
			text-align: center;
		}

		.empty-mark {
			display: grid;
			width: 38px;
			height: 38px;
			margin-bottom: 3px;
			place-items: center;
			border-radius: 12px;
			background: var(--mint);
			color: var(--green);
		}

		.empty-mark svg { width: 20px; height: 20px; }
		.empty-title { margin: 0; color: var(--ink); font-size: 14px; font-weight: 800; }
		.empty-copy { margin: 0; font-size: 12px; }

		.footer-note {
			margin: 16px 0 0;
			color: #8a938c;
			font-size: 11px;
			text-align: center;
		}

		button:focus-visible { outline: 3px solid rgb(39 123 93 / 35%); outline-offset: 2px; }

		@keyframes arrive {
			from { opacity: 0; transform: translateY(7px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 560px) {
			.page { width: min(100% - 28px, 760px); padding: 28px 0 40px; }
			.topline { margin-bottom: 27px; }
			h1 { font-size: 34px; }
			.hero { align-items: flex-start; flex-direction: column; gap: 9px; margin-bottom: 20px; }
			.hero-note { margin: 0; text-align: left; }
			.summary { padding: 19px 18px 17px; }
			.composer { gap: 8px; padding: 18px; }
			.task-input { padding: 0 11px; font-size: 13px; }
			.add-button { min-width: 48px; padding: 0 13px; }
			.add-label { display: none; }
			.list-toolbar { padding: 12px 18px 8px; }
			.filters { gap: 1px; }
			.filter-button { padding: 0 9px; }
			.task-list { padding: 0 18px 10px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: 0.01ms !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<main class="page">
		<header class="topline">
			<time id="today"></time>
		</header>

		<section class="hero" aria-labelledby="page-title">
			<div>
				<p class="eyebrow">ONE DAY AT A TIME</p>
				<h1 id="page-title">오늘의 할 일</h1>
			</div>
		</section>

		<section class="workspace" aria-label="오늘의 할 일 목록">
			<div class="summary">
				<div class="summary-copy">
					<p class="summary-title" id="summary-title">오늘도 차근차근</p>
					<p class="summary-caption" id="summary-caption">할 일을 적고 하나씩 완료해보세요.</p>
				</div>
				<span class="progress-count" id="progress-count">0 / 0</span>
			</div>
			<div class="progress-track" role="progressbar" aria-label="오늘의 완료율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track">
				<div class="progress-fill" id="progress-fill"></div>
			</div>

			<form class="composer" id="task-form">
				<input class="task-input" id="task-input" type="text" maxlength="160" autocomplete="off" aria-label="새 할 일">
				<button class="add-button" type="submit" aria-label="할 일 추가">
					<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
					<span class="add-label">추가하기</span>
				</button>
			</form>

			<div class="list-toolbar">
				<div class="filters" role="group" aria-label="할 일 필터">
					<button class="filter-button" type="button" data-filter="all" aria-pressed="true">전체</button>
					<button class="filter-button" type="button" data-filter="active" aria-pressed="false">남은 일</button>
					<button class="filter-button" type="button" data-filter="done" aria-pressed="false">완료</button>
				</div>
				<button class="clear-button" id="clear-completed" type="button">완료한 일 지우기</button>
			</div>

			<div class="task-list" id="task-list" aria-live="polite"></div>
		</section>
		<p class="footer-note">할 일은 이 기기에 자동으로 저장됩니다.</p>
	</main>

	<script>
		const storageKey = "one-day-tasks-v1";
		const taskForm = document.querySelector("#task-form");
		const taskInput = document.querySelector("#task-input");
		const taskList = document.querySelector("#task-list");
		const clearCompletedButton = document.querySelector("#clear-completed");
		const progressCount = document.querySelector("#progress-count");
		const progressTrack = document.querySelector("#progress-track");
		const progressFill = document.querySelector("#progress-fill");
		const summaryTitle = document.querySelector("#summary-title");
		const summaryCaption = document.querySelector("#summary-caption");
		const checkIcon = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12 4 4L19 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
		const trashIcon = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
		let activeFilter = "all";
		let tasks = loadTasks();

		function loadTasks() {
			try {
				const savedTasks = JSON.parse(localStorage.getItem(storageKey) || "[]");
				return Array.isArray(savedTasks)
					? savedTasks.filter((task) => task && typeof task.id === "string" && typeof task.text === "string" && typeof task.done === "boolean")
					: [];
			} catch {
				return [];
			}
		}

		function saveTasks() {
			try {
				localStorage.setItem(storageKey, JSON.stringify(tasks));
			} catch {
				summaryCaption.textContent = "저장 공간을 사용할 수 없어 새로고침하면 목록이 사라질 수 있어요.";
			}
		}

		function formatToday() {
			const now = new Date();
			const localDate = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
			document.querySelector("#today").dateTime = localDate.toISOString().slice(0, 10);
			document.querySelector("#today").textContent = new Intl.DateTimeFormat("ko-KR", {
				month: "long",
				day: "numeric",
				weekday: "long"
			}).format(now);
		}

		function visibleTasks() {
			if (activeFilter === "active") return tasks.filter((task) => !task.done);
			if (activeFilter === "done") return tasks.filter((task) => task.done);
			return tasks;
		}

		function render() {
			const completed = tasks.filter((task) => task.done).length;
			const remaining = tasks.length - completed;
			const percent = tasks.length ? Math.round((completed / tasks.length) * 100) : 0;
			progressCount.textContent = `${completed} / ${tasks.length}`;
			progressFill.style.width = `${percent}%`;
			progressTrack.setAttribute("aria-valuenow", String(percent));
			clearCompletedButton.disabled = completed === 0;

			summaryTitle.textContent = tasks.length > 0 && remaining === 0 ? "오늘의 할 일을 모두 마쳤어요" : "오늘도 차근차근";
			summaryCaption.textContent = tasks.length === 0
				? "할 일을 적고 하나씩 완료해보세요."
				: remaining === 0
					? "수고했어요. 오늘의 계획을 모두 완료했어요!"
					: `오늘 ${remaining}개의 할 일이 남아 있어요.`;

			const shownTasks = visibleTasks();
			if (shownTasks.length === 0) {
				const isEmptyList = tasks.length === 0;
				const emptyTitle = isEmptyList ? "아직 등록된 할 일이 없어요" : "여기에 표시할 일이 없어요";
				const emptyCopy = isEmptyList ? "첫 번째 할 일을 추가해 오늘을 시작해보세요." : "다른 필터를 선택해보세요.";
				taskList.innerHTML = `<div class="empty-state"><span class="empty-mark" aria-hidden="true">${checkIcon}</span><p class="empty-title">${emptyTitle}</p><p class="empty-copy">${emptyCopy}</p></div>`;
				return;
			}

			taskList.innerHTML = shownTasks.map((task) => `
				<div class="task-row${task.done ? " is-done" : ""}" data-id="${task.id}">
					<button class="task-check" type="button" data-action="toggle" aria-label="${task.done ? "완료 취소" : "완료로 표시"}" aria-pressed="${task.done}">${checkIcon}</button>
					<span class="task-text"></span>
					<button class="delete-button" type="button" data-action="delete" aria-label="할 일 삭제">${trashIcon}</button>
				</div>
			`).join("");

			taskList.querySelectorAll(".task-row").forEach((row) => {
				const task = tasks.find((item) => item.id === row.dataset.id);
				row.querySelector(".task-text").textContent = task.text;
			});
		}

		taskForm.addEventListener("submit", (event) => {
			event.preventDefault();
			const text = taskInput.value.trim();
			if (!text) {
				taskInput.focus();
				return;
			}
			tasks.unshift({ id: crypto.randomUUID(), text, done: false });
			saveTasks();
			render();
			taskInput.value = "";
			taskInput.focus();
		});

		taskList.addEventListener("click", (event) => {
			const button = event.target.closest("button[data-action]");
			if (!button) return;
			const row = button.closest(".task-row");
			if (!row) return;
			const task = tasks.find((item) => item.id === row.dataset.id);
			if (!task) return;

			if (button.dataset.action === "toggle") task.done = !task.done;
			if (button.dataset.action === "delete") tasks = tasks.filter((item) => item.id !== task.id);
			saveTasks();
			render();
		});

		document.querySelector(".filters").addEventListener("click", (event) => {
			const button = event.target.closest("[data-filter]");
			if (!button) return;
			activeFilter = button.dataset.filter;
			document.querySelectorAll(".filter-button").forEach((filterButton) => {
				filterButton.setAttribute("aria-pressed", String(filterButton === button));
			});
			render();
		});

		clearCompletedButton.addEventListener("click", () => {
			tasks = tasks.filter((task) => !task.done);
			saveTasks();
			render();
		});

		formatToday();
		render();
	</script>
</body>
</html>
